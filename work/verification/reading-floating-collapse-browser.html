<!doctype html><meta charset="utf-8"><title>Floating annotation checks</title>
<style>body{font:16px system-ui}article{margin:80px auto;width:80%;max-width:800px}#results{position:fixed;bottom:0}</style>
<article><p id="source">First highlight and second highlight in a close paragraph.</p><p id="next">The next paragraph must not move.</p></article><div style="position:fixed;right:20px;top:165px;width:210px;line-height:24px;color:#475467">Background text visible behind the translucent glass bubble. Background text visible behind the translucent glass bubble.</div><pre id="results">RUNNING</pre>
<script src="../../reading-margin-layout.js"></script><script>
let marginRoot;const attach=Element.prototype.attachShadow;Element.prototype.attachShadow=function(o){const r=attach.call(this,o);if(this.id==='hk-reading-margin')marginRoot=r;return r};
const entries=[{id:'a',text:'First highlight',note:'First note',color:'#dfeefc'},{id:'b',text:'Second highlight',note:'Second note',color:'#fff5b8'},{id:'c',text:'Third highlight',note:'Third note',color:'#dff2e0'},{id:'d',text:'Fourth highlight',note:'Fourth note',color:'#ece3fa'}];
let slotCalls=0;const nextTop=document.querySelector('#next').getBoundingClientRect().top;
window.chrome={storage:{onChanged:{addListener(){}}}};window.HkI18n={t:k=>k};
window.HkDeskBridge={key:()=> 'fixture',pageTheme:()=> 'light',highlights:async()=>entries,inlineAnchor:id=>{if(id)slotCalls++},anchors:ids=>ids.map((id,i)=>{const r=document.querySelector('#source').getBoundingClientRect();return{id,rect:{left:r.left+i*120,right:r.left+100+i*120,top:r.top+i*4,bottom:r.bottom+i*4},column:{left:0,right:innerWidth}}})};
window.HkReadingDeskUI={preferences:()=>({mode:'auto'}),annotationState:()=>({pinnedIds:[],obstacles:[]}),pin:async()=>{}};
</script><script src="../../reading-annotations.js"></script><script>
(async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms));try{await wait(300);const cards=[...marginRoot.querySelectorAll('.thought')];if(cards.length!==4)throw Error('expected four notes');if(!cards.every((card,i)=>i===0||cards[i-1].getBoundingClientRect().bottom<=card.getBoundingClientRect().top))throw Error('wrong order or overlap');if(marginRoot.querySelectorAll('.connector').length!==4)throw Error('missing connectors');if(getComputedStyle(cards[0]).backgroundColor===getComputedStyle(cards[1]).backgroundColor)throw Error('highlight colors missing');const expanded=cards[0].getBoundingClientRect().height;cards[0].querySelector('.collapse').click();await wait(100);if(cards[0].getBoundingClientRect().height>=expanded||getComputedStyle(cards[0].querySelector('.text')).display!=='none')throw Error('collapse failed');cards[0].querySelector('.collapse').click();await wait(100);if(getComputedStyle(cards[0].querySelector('.text')).display==='none')throw Error('expand failed');const a=cards[0].getBoundingClientRect(),b=cards[1].getBoundingClientRect();if(a.bottom>b.top&&b.bottom>a.top&&a.left<b.right&&b.left<a.right)throw Error('notes overlap');if(slotCalls||document.querySelector('#next').getBoundingClientRect().top!==nextTop)throw Error('article moved');for(let i=0;i<5;i++){HkPageAnnotations.refresh();await wait(70)}const again=cards[0].getBoundingClientRect();if(a.x!==again.x||a.y!==again.y)throw Error('position changed');document.querySelector('#results').textContent='PASS: colors, connectors, stable positions, no article movement';}catch(e){document.querySelector('#results').textContent='FAIL: '+e.message}})();
</script>
