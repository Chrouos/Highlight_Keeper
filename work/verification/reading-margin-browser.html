<!doctype html><html><head><meta charset="utf-8"><title>Reading margin checks</title></head><body><article style="margin:100px;width:550px"><h1>Article fixture</h1><p>Passages with thoughts appear in the margin.</p></article><pre id="results">RUNNING</pre>
<script src="../../reading-margin-layout.js"></script><script>
let marginRoot;const attach=Element.prototype.attachShadow;Element.prototype.attachShadow=function(options){const root=attach.call(this,options);if(this.id==='hk-reading-margin')marginRoot=root;return root};
let jsErrors=[];window.addEventListener('error',e=>jsErrors.push(e.message));let anchorCalls=0;let topA=180,topB=200;let pins=[];let displayMode='auto',fontSize=14;let entries=[{id:'a',color:'#dfeefc',text:'First passage',note:'A thought to read while scrolling.'}];let writes=0;
window.HkI18n={t:k=>k};window.chrome={storage:{onChanged:{addListener(){}}}};
window.HkDeskBridge={key:()=> 'https://example.com/article',highlights:async()=>structuredClone(entries),anchors:ids=>(anchorCalls++,ids.map(id=>({id,rect:{left:120,right:420,top:id==='a'?topA:topB,bottom:(id==='a'?topA:topB)+22},column:{left:100,right:700}})))};
window.HkReadingDeskUI={preferences:()=>({mode:displayMode,fontSize}),annotationState:()=>({pinnedIds:pins.map(p=>p.id),obstacles:[]}),pin:async(id,placement)=>{writes++;pins.push({id,placement});window.dispatchEvent(new Event('hk-reading-desk-change'));}};
</script><script src="../../reading-annotations.js"></script><script>
(async()=>{let checks=0;const assert=(ok,message)=>{if(!ok)throw Error(message);checks++};const wait=ms=>new Promise(r=>setTimeout(r,ms));
 await wait(150);assert(!!marginRoot,'margin root exists');assert(marginRoot.querySelectorAll('.thought').length===1,'thought appears without a click '+JSON.stringify({anchorCalls,jsErrors,w:innerWidth,h:innerHeight,dom:marginRoot.innerHTML.slice(-500)}));assert(marginRoot.querySelector('.text').textContent.includes('scrolling'),'thought shows canonical note');assert(marginRoot.querySelector('.connector'),'source has a dashed connector');assert(writes===0,'scrolling does not persist cards');assert(marginRoot.querySelector('.thought').style.getPropertyValue('--annotation-color')==='#dfeefc','annotation carries source highlight color');assert(getComputedStyle(marginRoot.querySelector('.quote')).display!=='none','annotation exposes source excerpt');assert(!marginRoot.querySelector('textarea'),'automatic note is read-only');const blueInk=getComputedStyle(marginRoot.querySelector('.text')).color;assert(blueInk!=='rgb(89, 103, 131)','note text no longer uses fixed gray-blue');

 const toc=document.createElement('nav');toc.style.cssText='position:fixed;left:720px;top:100px;width:280px;height:400px;background:white';toc.textContent='Website table of contents';document.body.append(toc);HkPageAnnotations.refresh();await wait(240);
 assert(marginRoot.querySelectorAll('.thought').length===0,'automatic note does not cover website navigation');
 toc.remove();HkPageAnnotations.refresh();await wait(240);assert(marginRoot.querySelectorAll('.thought').length===1,'annotation returns when website margin becomes clear');
 const widget=document.createElement('div');widget.style.cssText='position:fixed;left:720px;top:180px;width:280px;line-height:28px;background:white';widget.textContent='A website widget contains readable text and more content. '.repeat(10);document.body.append(widget);HkPageAnnotations.refresh();await wait(240);
 assert(marginRoot.querySelectorAll('.thought').length===0,'nonsemantic website text is also protected');
 widget.remove();HkPageAnnotations.refresh();await wait(240);
 topA=-200;HkPageAnnotations.refresh();await wait(240);assert(marginRoot.querySelectorAll('.thought').length===0,'leaving source fades out the note');
 topA=200;entries.push({id:'b',color:'#dff2e0',text:'Second passage',note:'Second thought.'});await HkPageAnnotations.reload();await wait(100);let cards=[...marginRoot.querySelectorAll('.thought')];assert(cards.length===1,'only the current thought appears');assert(cards[0].getBoundingClientRect().left>=700,'thought stays outside article');assert(writes===0,'automatic display remains transient');
 cards[0].querySelector('.pin').focus();topA=-200;HkPageAnnotations.refresh();await wait(240);assert(marginRoot.querySelectorAll('.thought').length===1,'focused notes still disappear when their source leaves');assert(getComputedStyle(marginRoot.querySelector('.text')).color!==blueInk,'switching to green highlight changes actual note text color');topA=200;HkPageAnnotations.refresh();await wait(100);cards=[...marginRoot.querySelectorAll('.thought')];

 const pinnedRect=cards[0].getBoundingClientRect();cards[0].querySelector('.pin').click();await wait(240);assert(pins.length===1,'pin is explicit');assert(pins[0].placement.x===pinnedRect.left,'pin retains its reading position');assert(marginRoot.querySelectorAll('.thought').length===1,'pinned note is not duplicated as transient');
 Object.defineProperty(window,'innerWidth',{configurable:true,value:400});pins=[];HkPageAnnotations.refresh();await wait(240);const compact=[...marginRoot.querySelectorAll('.thought')];assert(compact.length===0,'narrow layouts defer to source hover instead of detached popup');assert(!marginRoot.querySelector('.connector'),'compact view avoids a line across the article');
 displayMode='hover';HkPageAnnotations.refresh();await wait(240);assert(marginRoot.querySelectorAll('.thought').length===0,'hover-only mode stops automatic annotation');
 displayMode='auto';Object.defineProperty(window,'innerWidth',{configurable:true,value:1280});HkPageAnnotations.refresh();await wait(240);assert(marginRoot.querySelectorAll('.thought').length===1,'automatic mode resumes annotation when margin space returns');
 fontSize=18;HkPageAnnotations.refresh();await wait(240);assert(parseFloat(getComputedStyle(marginRoot.querySelector('.text')).fontSize)>20,'short annotations honor reader font preference');
 document.getElementById('results').textContent='PASS '+checks+' margin browser checks';
})().catch(e=>document.getElementById('results').textContent='FAIL '+e.stack);
</script></body></html>
