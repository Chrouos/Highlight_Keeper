<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../contentStyles.css"></head><body>
<pre id="results">RUNNING</pre><script>
let checks=0;try{for(const width of [240,280,340]){for(const labels of [['摘到桌面','儲存註解','刪除標註'],['Add to desk','Save note','Delete highlight']]){const menu=document.createElement('section');menu.className='hk-highlight-menu';Object.assign(menu.style,{display:'block',position:'relative',width:width+'px',padding:'16px'});const actions=document.createElement('div');actions.className='hk-menu-actions';menu.append(actions);document.body.append(menu);labels.forEach(text=>{const b=document.createElement('button');b.className='hk-menu-btn';b.textContent=text;actions.append(b)});for(const button of actions.children){const range=document.createRange();range.selectNodeContents(button);if(range.getClientRects().length!==1)throw Error('Label wraps: '+button.textContent+' at '+width);if(button.getBoundingClientRect().right>actions.getBoundingClientRect().right+1)throw Error('Button overflows at '+width);checks+=2;}}}document.getElementById('results').textContent='PASS '+checks+' layout checks';}catch(e){document.getElementById('results').textContent='FAIL '+e.message;}
</script></body></html>
