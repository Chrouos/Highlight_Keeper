<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="manager.pageTitle">Highlight Keeper — 笔記總覽</title>
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <main class="hk-manager">
      <header class="hk-manager-header">
        <div>
          <h1 data-i18n="manager.heading">筆記內容總覽</h1>
          <p data-i18n="manager.subheading">一次匯出/匯入所有頁面的標註，集中管理你的資料。</p>
        </div>
        <div class="hk-manager-header-right">
          <label class="hk-manager-lang">
            <span data-i18n="popup.langLabel">顯示語言</span>
            <select id="managerLang">
              <option value="zh" data-i18n="popup.langZh">繁體中文</option>
              <option value="en" data-i18n="popup.langEn">English</option>
            </select>
          </label>
          <button type="button" class="hk-manager-close" id="closeManagerBtn">×</button>
        </div>
      </header>
      <div class="hk-manager-search-row">
        <label class="hk-manager-search-label">
          <span data-i18n="manager.searchLabel">搜尋筆記</span>
          <input
            type="search"
            id="managerSearch"
            class="hk-manager-search"
            data-i18n-placeholder="manager.searchPlaceholder"
            placeholder="輸入關鍵字或頁面標題"
          />
        </label>
      </div>
      <section class="hk-manager-actions">
        <button type="button" id="downloadAllBtn" class="hk-manager-btn" data-i18n="manager.downloadAll">
          下載全部筆記
        </button>
        <label class="hk-manager-btn hk-manager-import">
          <span data-i18n="manager.importMulti">匯入多個 JSON</span>
          <input
            type="file"
            id="bulkImportInput"
            accept="application/json"
            multiple
          />
        </label>
      </section>
      <section class="hk-manager-sync" aria-labelledby="githubSyncTitle">
        <div class="hk-manager-sync-header">
          <div>
            <h2 id="githubSyncTitle" data-i18n="manager.githubBackup">GitHub 備份</h2>
            <p data-i18n="manager.githubDesc">填入 Personal Access Token 與儲存庫資訊，即可一鍵把全部筆記上傳到 GitHub。</p>
          </div>
        </div>
        <div class="hk-manager-sync-fields">
          <label class="hk-manager-field">
            <span data-i18n="manager.githubTokenLabel">GitHub Token</span>
            <input
              type="password"
              id="githubToken"
              class="hk-manager-input"
              placeholder="ghp_xxx"
            />
          </label>
          <label class="hk-manager-field">
            <span data-i18n="manager.githubRepoLabel">儲存庫（owner/repo）</span>
            <input
              type="text"
              id="githubRepo"
              class="hk-manager-input"
              placeholder="username/highlight-backup"
            />
          </label>
          <label class="hk-manager-field">
            <span data-i18n="manager.githubBranchLabel">分支</span>
            <input
              type="text"
              id="githubBranch"
              class="hk-manager-input"
              placeholder="main"
            />
          </label>
          <label class="hk-manager-field">
            <span data-i18n="manager.githubPathLabel">檔案路徑</span>
            <input
              type="text"
              id="githubPath"
              class="hk-manager-input"
              placeholder="backups/highlight-keeper.json"
            />
          </label>
        </div>
        <div class="hk-manager-sync-actions">
          <button type="button" id="githubDownloadBtn" class="hk-manager-btn" data-i18n="manager.githubDownload">
            從 GitHub 下載
          </button>
          <button type="button" id="githubUploadBtn" class="hk-manager-btn hk-manager-btn-muted" data-i18n="manager.githubUpload">
            上傳到 GitHub
          </button>
        </div>
        <p
          id="githubSyncStatus"
          class="hk-manager-sync-status"
          role="status"
          aria-live="polite"
        ></p>
      </section>
      <section class="hk-manager-summary">
        <header>
          <h2 data-i18n="manager.pageListHeading">頁面清單</h2>
          <span id="pageCount" class="hk-manager-count"></span>
        </header>
        <div class="hk-manager-controls">
          <label class="hk-manager-sort-label">
            <span data-i18n="manager.sortLabel">排序</span>
            <select id="managerSort" class="hk-manager-sort">
              <option value="updated" data-i18n="manager.sortUpdated">最後更新</option>
              <option value="count" data-i18n="manager.sortCount">筆記數</option>
              <option value="title" data-i18n="manager.sortTitle">標題</option>
            </select>
          </label>
          <div id="managerTagFilter" class="hk-manager-tag-filter"></div>
        </div>
        <div id="pageList" class="hk-manager-list"></div>
      </section>
      <section id="managerStatus" class="hk-manager-status" role="status" aria-live="polite"></section>
    </main>
    <script src="parsers.js"></script>
    <script src="i18n.js"></script>
    <script src="manager.js" type="module"></script>
  </body>
</html>
