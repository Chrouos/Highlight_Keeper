<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Highlight Keeper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="hk-pop">
      <!-- ── Header：標題 + 本頁狀態 ─────────────────────── -->
      <header class="hk-pop-head">
        <div class="hk-pop-brand">
          <img class="hk-pop-logo" src="Icon/32.png" alt="" />
          <span class="hk-pop-name">Highlight Keeper</span>
        </div>
        <div class="hk-pop-meta">
          <span id="markCount" class="hk-pop-count">—</span>
          <span class="hk-pop-dot">·</span>
          <span id="aiMode" class="hk-pop-mode">—</span>
        </div>
      </header>

      <div class="hk-pop-body">
        <!-- ── ① 複製 Prompt ──────────────────────────── -->
        <section class="hk-card" aria-labelledby="stepCopyTitle">
          <div class="hk-card-head">
            <span class="hk-step">1</span>
            <h2 id="stepCopyTitle" class="hk-card-title" data-i18n="popup.stepCopyTitle">
              複製 Prompt
            </h2>
          </div>
          <p class="hk-card-desc" data-i18n="popup.stepCopyDesc">
            把本頁全文與色票組成 Prompt，貼到 ChatGPT 讓它畫重點、寫摘要。
          </p>
          <button type="button" id="aiHighlightBtn" class="hk-btn hk-btn-primary" data-i18n="popup.aiAutoHighlight">
            複製 AI 畫重點 Prompt
          </button>
          <button type="button" id="mindmapPromptBtn" class="hk-btn hk-btn-quiet" data-i18n="popup.copyMindmapPrompt">
            改複製心智圖 Prompt
          </button>
        </section>

        <!-- ── ② 貼上 ────────────────────────────────── -->
        <section class="hk-card" aria-labelledby="stepPasteTitle">
          <div class="hk-card-head">
            <span class="hk-step">2</span>
            <h2 id="stepPasteTitle" class="hk-card-title" data-i18n="popup.stepPasteTitle">
              貼上
            </h2>
          </div>
          <p class="hk-card-desc" data-i18n="popup.stepPasteDesc">
            把 AI 的回覆貼進來，會自動套用重點、摘要、標籤與心智圖。
          </p>
          <textarea
            id="aiPasteInput"
            class="hk-textarea"
            rows="3"
            data-i18n-placeholder="popup.aiPastePlaceholder"
            placeholder="把 ChatGPT 的回覆貼在這裡，直接套用…"
          ></textarea>
          <button type="button" id="aiPasteApplyBtn" class="hk-btn hk-btn-primary" data-i18n="popup.aiPasteApply">
            貼上並套用
          </button>
        </section>

        <!-- ── ③ 分享此網頁 ──────────────────────────── -->
        <section class="hk-card" aria-labelledby="stepShareTitle">
          <div class="hk-card-head">
            <span class="hk-step">3</span>
            <h2 id="stepShareTitle" class="hk-card-title" data-i18n="popup.stepShareTitle">
              分享此網頁
            </h2>
          </div>
          <p class="hk-card-desc" data-i18n="popup.stepShareDesc">
            對方點開就是原文；裝了 Highlight Keeper 會跳出「匯入」收下你的筆記。
          </p>
          <button
            type="button"
            id="shareLinkBtn"
            class="hk-btn hk-btn-primary"
            data-i18n="popup.shareLink"
            data-i18n-title="popup.shareLinkTitle"
            title="複製分享連結：對方點開原文，裝了 Highlight Keeper 就能一鍵匯入"
          >
            複製分享連結
          </button>
          <div class="hk-btn-row">
            <button
              type="button"
              id="copyNotesBtn"
              class="hk-btn hk-btn-ghost"
              data-i18n="popup.copyNotesShort"
              data-i18n-title="popup.copyNotesTitle"
              title="把本頁筆記複製成 Markdown，貼到聊天、筆記軟體都可讀"
            >
              複製 Markdown
            </button>
            <button
              type="button"
              id="downloadNotesBtn"
              class="hk-btn hk-btn-ghost"
              data-i18n="popup.downloadNotesShort"
              data-i18n-title="popup.downloadNotesTitle"
              title="下載本頁筆記 JSON，給也用 Highlight Keeper 的人匯入"
            >
              下載 JSON
            </button>
          </div>
        </section>
      </div>

      <!-- ── 狀態列 ─────────────────────────────────── -->
      <p id="popStatus" class="hk-pop-status" role="status" aria-live="polite"></p>

      <!-- ── 開啟面板 ───────────────────────────────── -->
      <div class="hk-pop-panel-cta">
        <button type="button" id="openPanelBtn" class="hk-btn hk-btn-outline" data-i18n="popup.openPanel">
          在頁面開啟面板
        </button>
        <span class="hk-pop-kbd" data-i18n="popup.panelHint">顏色、標籤、搜尋、備份都在面板裡</span>
      </div>

      <!-- ── 頁尾 ───────────────────────────────────── -->
      <footer class="hk-pop-foot">
        <button type="button" id="openManagerBtn" class="hk-link" data-i18n="popup.openManager">
          管理所有筆記
        </button>
        <select id="langSelect" class="hk-pop-lang" data-i18n-aria-label="popup.langLabel" aria-label="顯示語言">
          <option value="zh" data-i18n="popup.langZh">繁體中文</option>
          <option value="en" data-i18n="popup.langEn">English</option>
        </select>
      </footer>
    </main>
    <script src="shared.js"></script>
    <script src="parsers.js"></script>
    <script src="share-link.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
